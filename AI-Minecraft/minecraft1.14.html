  const HOTBAR_SIZE = 9;
  const INV_SIZE = 36;             // 9x4 grid (was 27; swords needed the extra row)
  const CRAFT_SIZE = 9;            // 3x3 crafting grid
  const MAX_STACK = 64;             // max items per stack

  // Slots hold either null (empty) or { type: <block id>, count: <number> }.
  // In creative mode count is Infinity (items never run out).
  let hotbarSlots = new Array(HOTBAR_SIZE).fill(null);
  let invSlots = new Array(INV_SIZE).fill(null);
  let craftingSlots = new Array(CRAFT_SIZE).fill(null);
  let craftingOutput = null;        // null | { type, count }
  let hotbarIndex = 0;

  // ---------- Crafting recipes ----------
  // Each recipe is a 3x3 pattern (0 = empty). Matching crops both the
  // player's grid and the recipe to their non-empty bounding box, so a recipe
  // placed anywhere in the 3x3 grid still matches.
  const RECIPES = [
    // 1 Wood -> 4 Planks
    { pattern: [[WOOD,0,0],[0,0,0],[0,0,0]], output: { type: PLANKS, count: 4 } },
    // 2 Planks (vertical) -> 4 Sticks
    { pattern: [[PLANKS,0,0],[PLANKS,0,0],[0,0,0]], output: { type: STICK, count: 4 } },
    // 3 Planks (top row) + 2 Sticks (middle column, rows 2 & 3) -> Wooden Pickaxe
    { pattern: [[PLANKS,PLANKS,PLANKS],[0,STICK,0],[0,STICK,0]], output: { type: WOODEN_PICKAXE, count: 1 } },
    // 3 Stone (top row) + 2 Sticks (middle column, rows 2 & 3) -> Stone Pickaxe
    { pattern: [[STONE,STONE,STONE],[0,STICK,0],[0,STICK,0]], output: { type: STONE_PICKAXE, count: 1 } },
    // 8 Stone ring (centre empty) -> Furnace
    { pattern: [[STONE,STONE,STONE],[STONE,0,STONE],[STONE,STONE,STONE]], output: { type: FURNACE, count: 1 } },
    // 3 Iron Ingots (top row) + 2 Sticks (middle column, rows 2 & 3) -> Iron Pickaxe
    { pattern: [[IRON_INGOT,IRON_INGOT,IRON_INGOT],[0,STICK,0],[0,STICK,0]], output: { type: IRON_PICKAXE, count: 1 } },
    // 3 Gold Ingots (top row) + 2 Sticks (middle column, rows 2 & 3) -> Gold Pickaxe
    { pattern: [[GOLD_INGOT,GOLD_INGOT,GOLD_INGOT],[0,STICK,0],[0,STICK,0]], output: { type: GOLD_PICKAXE, count: 1 } },
    // Swords are ONE vertical column (blade on top, stick at the bottom) —
    // deliberately distinct from the 3-wide pickaxe "T".
    // 2 Stone stacked over 1 Stick -> Stone Sword
    { pattern: [[0,STONE,0],[0,STONE,0],[0,STICK,0]], output: { type: STONE_SWORD, count: 1 } },
    // 2 Iron Ingots stacked over 1 Stick -> Iron Sword
    { pattern: [[0,IRON_INGOT,0],[0,IRON_INGOT,0],[0,STICK,0]], output: { type: IRON_SWORD, count: 1 } },
    // 2 Gold Ingots stacked over 1 Stick -> Gold Sword
    { pattern: [[0,GOLD_INGOT,0],[0,GOLD_INGOT,0],[0,STICK,0]], output: { type: GOLD_SWORD, count: 1 } },
  ];

  // Crop a 3x3 pattern (array of 3 rows, each 3 cells) to its non-empty
  // bounding box. Returns null if the pattern is entirely empty.
  function cropPattern(pattern) {
    let minR = 3, maxR = -1, minC = 3, maxC = -1;
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        if (pattern[r][c] !== 0) {
          if (r < minR) minR = r;
          if (r > maxR) maxR = r;
          if (c < minC) minC = c;
          if (c > maxC) maxC = c;
        }
      }
    }
    if (maxR < 0) return null;
    const out = [];
    for (let r = minR; r <= maxR; r++) {
      const row = [];
      for (let c = minC; c <= maxC; c++) row.push(pattern[r][c]);
      out.push(row);
    }
    return out;
  }

  // Check the current 3x3 crafting grid against all recipes. Returns the
  // matching recipe's output, or null if no recipe matches.
  function matchRecipe() {
    // Build the player's 3x3 pattern from craftingSlots.
    const grid = [];
    for (let r = 0; r < 3; r++) {
      const row = [];
      for (let c = 0; c < 3; c++) {
        const s = craftingSlots[r * 3 + c];
        row.push(s ? s.type : 0);
      }
      grid.push(row);
    }
    const playerCrop = cropPattern(grid);
    if (!playerCrop) return null;

    for (const recipe of RECIPES) {
      const recipeCrop = cropPattern(recipe.pattern);
      if (!recipeCrop) continue;
      if (playerCrop.length !== recipeCrop.length) continue;
      if (playerCrop[0].length !== recipeCrop[0].length) continue;
      let match = true;
      for (let r = 0; r < playerCrop.length && match; r++) {
        for (let c = 0; c < playerCrop[0].length; c++) {
          if (playerCrop[r][c] !== recipeCrop[r][c]) { match = false; break; }
        }
      }
      if (match) return recipe.output;
    }
    return null;
  }

  // (Re)initialize inventory contents based on the selected game mode.
  function initInventory(mode) {
    hotbarSlots = new Array(HOTBAR_SIZE).fill(null);
    invSlots = new Array(INV_SIZE).fill(null);
    craftingSlots = new Array(CRAFT_SIZE).fill(null);
    craftingOutput = null;
    if (mode === 'creative') {
      // Creative: all item types available infinitely. The first 9 fill the
      // hotbar; all types also go into the main inventory (36 slots).
      const types = [
        GRASS, DIRT, STONE, WATER, WOOD, LEAVES, PLANKS, STICK, WOODEN_PICKAXE, STONE_PICKAXE,
        COAL_ORE, IRON_ORE, GOLD_ORE, DIAMOND_ORE, REDSTONE_ORE,
        COAL, RAW_IRON, RAW_GOLD, DIAMOND, REDSTONE,
        FURNACE, IRON_INGOT, GOLD_INGOT, IRON_PICKAXE, GOLD_PICKAXE,
        STONE_SWORD, IRON_SWORD, GOLD_SWORD,
      ];
      for (let i = 0; i < types.length; i++) {
        if (i < HOTBAR_SIZE) hotbarSlots[i] = { type: types[i], count: Infinity };
        if (i < INV_SIZE) invSlots[i] = { type: types[i], count: Infinity };
      }
    }
    // Survival: everything starts empty — items come from breaking blocks
    // and crafting.
    renderHotbar();
    renderInventory();
  }

  const hotbarEl = document.getElementById('hotbar');
  const invGridEl = document.getElementById('inv-grid');
  const invHotbarEl = document.getElementById('inv-hotbar');
  const craftGridEl = document.getElementById('craft-grid');
  const craftOutputEl = document.getElementById('craft-output');
  const inventoryEl = document.getElementById('inventory');
  const itemNameEl = document.getElementById('item-name');
  const furnaceEl = document.getElementById('furnace');
  const furnaceInputEl = document.getElementById('furnace-input');
  const furnaceFuelEl = document.getElementById('furnace-fuel');
  const furnaceOutputEl = document.getElementById('furnace-output');
  const furnaceFireFill = document.getElementById('furnace-fire-fill');
  const furnaceArrowFill = document.getElementById('furnace-arrow-fill');

  function getSlot(container, index) {
    if (container === 'hotbar') return hotbarSlots[index];
    if (container === 'craft') return craftingSlots[index];
    if (container === 'furnace-input') return openFurnaceState ? openFurnaceState.input : null;
    if (container === 'furnace-fuel') return openFurnaceState ? openFurnaceState.fuel : null;
    if (container === 'furnace-output') return openFurnaceState ? openFurnaceState.output : null;
    return invSlots[index];
  }
  function setSlot(container, index, item) {
    if (container === 'hotbar') hotbarSlots[index] = item;
    else if (container === 'craft') craftingSlots[index] = item;
    else if (container === 'furnace-input') { if (openFurnaceState) { openFurnaceState.input = item; openFurnaceState.dirty = true; } }
    else if (container === 'furnace-fuel') { if (openFurnaceState) { openFurnaceState.fuel = item; openFurnaceState.dirty = true; } }
    else if (container === 'furnace-output') { if (openFurnaceState) { openFurnaceState.output = item; openFurnaceState.dirty = true; } }
    else invSlots[index] = item;
  }
  // Convenience: true when a slot holds a usable item.
  function slotHasItem(container, index) {
    const s = getSlot(container, index);
    return !!s && s.count > 0;
  }

  // Add `count` items of `type` to the inventory (hotbar first, then main
  // inventory). Stacks with existing slots of the same type (up to MAX_STACK),
  // otherwise fills the first empty slot. Returns true if all items were
  // added, false if the inventory was full and some were dropped.
  // In creative mode this is a no-op (items are infinite).
  function addItem(type, count) {
    if (gameMode === 'creative') return true;
    let remaining = count;

    // Pass 1: stack into existing slots of the same type.
    for (const container of ['hotbar', 'inv']) {
      const slots = container === 'hotbar' ? hotbarSlots : invSlots;
      for (let i = 0; i < slots.length && remaining > 0; i++) {
        const s = slots[i];
        if (s && s.type === type && s.count < MAX_STACK) {
          const space = MAX_STACK - s.count;
          const add = Math.min(space, remaining);
          s.count += add;
          remaining -= add;
        }
      }
    }

    // Pass 2: fill empty slots.
    for (const container of ['hotbar', 'inv']) {
      const slots = container === 'hotbar' ? hotbarSlots : invSlots;
      for (let i = 0; i < slots.length && remaining > 0; i++) {
        if (slots[i] == null) {
          const add = Math.min(MAX_STACK, remaining);
          slots[i] = { type, count: add };
          remaining -= add;
        }
      }
    }

    return remaining === 0;
  }

  function swatch(color) {
    const d = document.createElement('div');
    d.className = 'swatch';
    d.style.background = color;
    return d;
  }
  // Build the visual icon for an item. Items with an `icon` render a bold
  // monospace glyph (tools "T"/"I", ore markings "C"/"Fe"/💎); ore blocks
  // additionally get a dark `bg` square behind the glyph. Everything else is
  // a plain colored swatch.
  function makeItemIcon(item) {
    if (item && item.icon) {
      const size = item.icon.size || 24;
      let host;
      if (item.icon.bg) {
        // Block-style icon: dark square (sized like a swatch) with the glyph
        // centred inside.
        host = document.createElement('div');
        host.className = 'block-icon';
        host.style.width = '34px';
        host.style.height = '34px';
        host.style.background = item.icon.bg;
        host.style.display = 'flex';
        host.style.alignItems = 'center';
        host.style.justifyContent = 'center';
        host.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.5)';
      }
      const span = document.createElement('span');
      span.className = 'item-glyph';
      span.textContent = item.icon.glyph;
      span.style.color = item.icon.color;
      span.style.fontFamily = 'monospace';
      span.style.fontWeight = 'bold';
      span.style.fontSize = size + 'px';
      span.style.lineHeight = '1';
      span.style.display = 'inline-block';
      const rot = item.icon.rotate != null ? item.icon.rotate : 0;
      span.style.transform = 'rotate(' + rot + 'deg)';
      span.style.userSelect = 'none';
      if (host) { host.appendChild(span); return host; }
      return span;
    }
    return swatch(item.color);
  }
  // Small count label shown at the bottom-right of an item swatch.
  function countLabel(count) {
    const d = document.createElement('span');
    d.className = 'count-label';
    d.textContent = count;
    return d;
  }

  // Build one slot element. Shared by the floating hotbar, the inventory grid
  // and the hotbar row embedded in the inventory panel, so all three look and
  // behave identically (same drag handlers, count badges, tooltips).
  function makeSlotEl(container, index, stack, active) {
    const slot = document.createElement('div');
    slot.className = 'slot' + (active ? ' active' : '');
    slot.dataset.container = container;
    slot.dataset.index = index;
    if (stack && stack.count > 0 && ITEM_BY_ID[stack.type]) {
      slot.appendChild(makeItemIcon(ITEM_BY_ID[stack.type]));
      // Show the count number only in survival mode and only when > 1.
      if (gameMode === 'survival' && stack.count > 1) {
        slot.appendChild(countLabel(stack.count));
      }
      slot.title = ITEM_BY_ID[stack.type].name;
    }
    // Every slot (empty or not) needs the drag/place handler so that a held
    // item can be dropped into an empty slot.
    attachDrag(slot, container, index);
    return slot;
  }

  // The 9-slot row inside the inventory panel. It is bound to hotbarSlots —
  // the very same array the floating bar renders — so dragging items in or out
  // of it is reflected on the real hotbar the moment the panel closes.
  function renderInvHotbarRow() {
    invHotbarEl.innerHTML = '';
    for (let i = 0; i < HOTBAR_SIZE; i++) {
      invHotbarEl.appendChild(makeSlotEl('hotbar', i, hotbarSlots[i], i === hotbarIndex));
    }
  }

  function renderHotbar() {
    hotbarEl.innerHTML = '';
    for (let i = 0; i < HOTBAR_SIZE; i++) {
      hotbarEl.appendChild(makeSlotEl('hotbar', i, hotbarSlots[i], i === hotbarIndex));
    }
    renderHandItem();
    updatePlayerDamage();   // weapon bonus follows the selected slot
    // Keep the embedded row in sync when the panel happens to be open.
    if (inventoryOpen) renderInvHotbarRow();
  }

  // ---------- First-person held item view ----------
  // A big item icon anchored at the bottom-right of the screen, mirroring
  // whatever the currently selected hotbar slot holds.
  const handItemEl = document.getElementById('hand-item');
  const handSwingEl = document.getElementById('hand-swing');
  const handIconEl = document.getElementById('hand-icon');
  let lastHandSwing = 0;

  function handGlyph(item) {
    const span = document.createElement('span');
    span.className = 'hand-glyph';
    span.textContent = item.icon.glyph;
    span.style.color = item.icon.color;
    if (item.icon.rotate) span.style.transform = 'rotate(' + item.icon.rotate + 'deg)';
    return span;
  }

  function renderHandItem() {
    const s = hotbarSlots[hotbarIndex];
    const item = (s && s.count > 0 && ITEM_BY_ID[s.type]) ? ITEM_BY_ID[s.type] : null;
    handIconEl.innerHTML = '';
    if (!item || thirdPerson) {
      // Empty hand — or third person, where the 2D hand overlay makes no sense.
      handItemEl.classList.remove('visible');
      return;
    }
    const icon = item.icon;
    if (icon) {
      if (icon.bg) {
        // Ore-style block: dark backdrop square with the glyph inside.
        const block = document.createElement('div');
        block.className = 'hand-block';
        block.style.background = icon.bg;
        block.appendChild(handGlyph(item));
        handIconEl.appendChild(block);
      } else {
        handIconEl.appendChild(handGlyph(item));
      }
    } else {
      // Plain block: a solid colour square filling the hand.
      const sw = document.createElement('div');
      sw.className = 'hand-block';
      sw.style.background = item.color;
      handIconEl.appendChild(sw);
    }
    handItemEl.classList.add('visible');
  }

  // Play a quick downward chop. Rate-limited so repeated calls during
  // continuous mining don't restart the animation every frame.
  function swingHand() {
    const now = performance.now();
    if (now - lastHandSwing < 180) return;
    lastHandSwing = now;
    handSwingEl.classList.remove('swinging');
    void handSwingEl.offsetWidth;   // force reflow so the animation restarts
    handSwingEl.classList.add('swinging');
  }
  handSwingEl.addEventListener('animationend', () => handSwingEl.classList.remove('swinging'));

  function renderInventory() {
    invGridEl.innerHTML = '';
    for (let i = 0; i < INV_SIZE; i++) {
      invGridEl.appendChild(makeSlotEl('inv', i, invSlots[i], false));
    }
    renderInvHotbarRow();
    renderCrafting();
  }

  // Render the 3x3 crafting grid + output slot, and re-evaluate the recipe.
  function renderCrafting() {
    // Re-evaluate the recipe whenever the grid is rendered.
    craftingOutput = matchRecipe();

    craftGridEl.innerHTML = '';
    for (let i = 0; i < CRAFT_SIZE; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.container = 'craft';
      slot.dataset.index = i;
      const s = craftingSlots[i];
      if (s && s.count > 0 && ITEM_BY_ID[s.type]) {
        slot.appendChild(makeItemIcon(ITEM_BY_ID[s.type]));
        if (gameMode === 'survival' && s.count > 1) {
          slot.appendChild(countLabel(s.count));
        }
        slot.title = ITEM_BY_ID[s.type].name;
      }
      attachDrag(slot, 'craft', i);
      craftGridEl.appendChild(slot);
    }

    // Output slot
    craftOutputEl.innerHTML = '';
    if (craftingOutput && ITEM_BY_ID[craftingOutput.type]) {
      craftOutputEl.appendChild(makeItemIcon(ITEM_BY_ID[craftingOutput.type]));
      if (craftingOutput.count > 1) {
        craftOutputEl.appendChild(countLabel(craftingOutput.count));
      }
      craftOutputEl.title = ITEM_BY_ID[craftingOutput.type].name;
      craftOutputEl.classList.add('has-output');
    } else {
      craftOutputEl.classList.remove('has-output');
    }
  }

  function toggleInventory() {
    // Closing the inventory while still holding an item returns it to its
    // source slot first (so it never vanishes).
    if (inventoryOpen && dragItem) returnDragItemToSource();
    inventoryOpen = !inventoryOpen;
    if (inventoryOpen) {
      inventoryEl.classList.add('open');
      // The floating bar is redundant while the panel is open: the panel has
      // its own bound-to-the-same-data hotbar row at the bottom.
      hotbarEl.classList.add('hidden');
      renderInventory();   // refresh contents + the embedded hotbar row
      if (controls.isLocked) controls.unlock();
    } else {
      inventoryEl.classList.remove('open');
      hotbarEl.classList.remove('hidden');
      controls.lock(); // re-lock pointer (user gesture = keydown)
    }
    // If we no longer hold anything, hide the cursor ghost.
    if (!dragItem) updateGhost();
  }

  // ---------- Furnace UI ----------
  function openFurnaceAt(x, y, z) {
    openFurnaceState = getFurnaceState(x, y, z);
    openFurnaceKey = k(x, y, z);
    furnaceOpen = true;
    openFurnaceState.dirty = true;
    furnaceEl.classList.add('open');
    renderFurnace();
    // Free the mouse so the player can click the furnace slots.
    if (controls.isLocked) controls.unlock();
  }

  function closeFurnace() {
    if (!furnaceOpen) return;
    // Never swallow a held item when closing the UI.
    if (dragItem) returnDragItemToSource();
    furnaceOpen = false;
    openFurnaceState = null;
    openFurnaceKey = null;
    furnaceEl.classList.remove('open');
    updateGhost();
    controls.lock(); // re-lock the pointer (runs from a user gesture)
  }

  function renderFurnace() {
    if (!openFurnaceState) return;
    renderFurnaceSlot(furnaceInputEl, openFurnaceState.input);
    renderFurnaceSlot(furnaceFuelEl, openFurnaceState.fuel);
    renderFurnaceSlot(furnaceOutputEl, openFurnaceState.output);
    openFurnaceState.dirty = false;
    updateFurnaceBars();
  }
  function renderFurnaceSlot(el, s) {
    el.innerHTML = '';
    if (s && s.count > 0 && ITEM_BY_ID[s.type]) {
      el.appendChild(makeItemIcon(ITEM_BY_ID[s.type]));
      if (s.count > 1) el.appendChild(countLabel(s.count));
      el.title = ITEM_BY_ID[s.type].name;
    } else {
      el.removeAttribute('title');
    }
  }
  // Fire bar = remaining burn time; arrow bar = smelting progress.
  function updateFurnaceBars() {
    const st = openFurnaceState;
    const burnPct = (st && st.burnTotal > 0)
      ? Math.max(0, Math.min(1, st.burnTime / st.burnTotal)) : 0;
    const cookPct = st ? Math.max(0, Math.min(1, st.cook / COOK_TIME)) : 0;
    furnaceFireFill.style.height = (burnPct * 100) + '%';
    furnaceArrowFill.style.width = (cookPct * 100) + '%';
  }

  // Advance one furnace by dt seconds: burn fuel, then cook input -> output.
  function tickFurnace(st, dt) {
    const outType = st.input ? SMELT_RECIPES[st.input.type] : null;
    const canSmelt = !!outType &&
      (!st.output || (st.output.type === outType && st.output.count < MAX_STACK));

    // Ignite: consume one fuel unit when idle and there is work to do.
    if (st.burnTime <= 0 && canSmelt && st.fuel && FUEL_TIME[st.fuel.type] != null) {
      st.burnTime = FUEL_TIME[st.fuel.type];
      st.burnTotal = st.burnTime;
      if (st.fuel.count !== Infinity) {
        st.fuel.count -= 1;
        if (st.fuel.count <= 0) st.fuel = null;
      }
      st.dirty = true;
    }

    if (st.burnTime > 0) {
      st.burnTime -= dt;
      if (st.burnTime < 0) st.burnTime = 0;
      if (canSmelt) {
        st.cook += dt;
        if (st.cook >= COOK_TIME) {
          st.cook -= COOK_TIME;
          // Consume one input and produce one output.
          if (st.input.count !== Infinity) {
            st.input.count -= 1;
            if (st.input.count <= 0) st.input = null;
          }
          if (st.output) st.output.count += 1;
          else st.output = { type: outType, count: 1 };
          st.dirty = true;
        }
      } else {
        st.cook = 0;
      }
    } else {
      st.cook = 0;
    }
  }

  // All furnaces keep running even when their UI is closed.
  function tickFurnaces(dt) {
    for (const st of furnaceStates.values()) tickFurnace(st, dt);
  }

  // ---------- Item drag / split / merge (Minecraft-style) ----------
  // A single held item ("dragItem") floats on the cursor. Picking up deducts
  // from the source slot immediately (Model A). Cancelling returns the held
  // item to its source slot.
  let dragItem = null;           // null | { type, count, sourceContainer, sourceIndex }
  let dragGhost = null;          // floating swatch following the cursor

  // Create / update / remove the ghost element that follows the cursor.
  function updateGhost() {
    if (!dragItem) {
      if (dragGhost) { dragGhost.remove(); dragGhost = null; }
      return;
    }
    if (!dragGhost) {
      dragGhost = document.createElement('div');
      dragGhost.className = 'swatch drag-ghost';
      dragGhost.style.position = 'fixed';
      dragGhost.style.pointerEvents = 'none';
      dragGhost.style.zIndex = '100';
      dragGhost.style.opacity = '0.85';
      dragGhost.style.width = '36px';
      dragGhost.style.height = '36px';
      dragGhost.style.display = 'flex';
      dragGhost.style.alignItems = 'center';
      dragGhost.style.justifyContent = 'center';
      dragGhost.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.4)';
      document.body.appendChild(dragGhost);
    }
    const item = ITEM_BY_ID[dragItem.type];
    // Rebuild the ghost content from scratch so switching between a tool
    // glyph, an ore block icon, and a plain swatch always renders cleanly
    // (no stale nested nodes left behind).
    dragGhost.innerHTML = '';
    if (item && item.icon) {
      dragGhost.style.background = 'transparent';
      dragGhost.style.boxShadow = 'none';
      dragGhost.appendChild(makeItemIcon(item));
    } else if (item) {
      dragGhost.style.background = item.color;
      dragGhost.style.boxShadow = 'inset 0 0 0 1px rgba(0,0,0,0.4)';
    }
    // Show count on the ghost when > 1 (survival only).
    if (gameMode === 'survival' && dragItem.count > 1) {
      dragGhost.appendChild(countLabel(dragItem.count));
    }
  }
  function moveGhost(clientX, clientY) {
    if (dragGhost) {
      dragGhost.style.left = (clientX - 18) + 'px';
      dragGhost.style.top = (clientY - 18) + 'px';
    }
  }

  // Find the slot (data-container / data-index) under the cursor, or null.
  function getSlotUnderCursor(clientX, clientY) {
    const el = document.elementFromPoint(clientX, clientY);
    let node = el;
    while (node && !node.dataset) node = node.parentElement;
    while (node && node.dataset && node.dataset.container == null) {
      node = node.parentElement;
    }
    if (node && node.dataset && node.dataset.container != null) {
      return {
        container: node.dataset.container,
        index: parseInt(node.dataset.index, 10),
      };
    }
    return null;
  }

  // Pick up items from a slot into the cursor.
  // mode: 'all' (left click) takes the whole stack; 'half' (right click)
  // takes ceil(count/2) and leaves the rest. In creative mode items are
  // infinite, so the source is never depleted.
  function pickupFromSlot(container, index, mode) {
    const s = getSlot(container, index);
    if (!s || s.count <= 0) return;
    let take;
    if (s.count === Infinity) {
      take = Infinity;                       // creative: never deplete
    } else if (mode === 'half') {
      if (s.count <= 1) return;              // can't split a single item
      take = Math.ceil(s.count / 2);
      s.count -= take;
      if (s.count <= 0) setSlot(container, index, null);
    } else {
      take = s.count;
      setSlot(container, index, null);
    }
    dragItem = { type: s.type, count: take, sourceContainer: container, sourceIndex: index };
    updateGhost();
  }

  // Return the held item back to its source slot (merge if possible).
  function returnDragItemToSource() {
    if (!dragItem) return;
    const { type, count, sourceContainer, sourceIndex } = dragItem;
    const src = getSlot(sourceContainer, sourceIndex);
    if (!src) {
      setSlot(sourceContainer, sourceIndex, { type, count });
    } else if (src.type === type && src.count < MAX_STACK) {
      src.count = Math.min(MAX_STACK, src.count + count);
    } else {
      // Source slot now holds a different (or full) item — fall back to
      // adding to the inventory; if even that fails the item is dropped.
      addItem(type, count);
    }
    dragItem = null;
    updateGhost();
  }

  // Place some of the held item into a target slot.
  // amount: 'all' (left click) or 1 (right click).
  // Returns true if anything was placed.
  function placeDragItem(targetContainer, targetIndex, amount) {
    if (!dragItem) return false;
    const target = getSlot(targetContainer, targetIndex);
    const want = (amount === 'all') ? dragItem.count : 1;
    let placed = 0;

    if (!target) {
      // Empty slot: place up to `want` (capped by what we're holding).
      placed = Math.min(want, dragItem.count);
      setSlot(targetContainer, targetIndex, { type: dragItem.type, count: placed });
    } else if (target.type === dragItem.type && target.count < MAX_STACK) {
      // Same type, not full: merge up to the stack limit.
      const space = MAX_STACK - target.count;
      placed = Math.min(want, space, dragItem.count);
      target.count += placed;
    } else {
      // Different type or full: cannot place.
      return false;
    }

    if (dragItem.count !== Infinity) {
      dragItem.count -= placed;
      if (dragItem.count <= 0) dragItem = null;
    }
    updateGhost();
    return placed > 0;
  }

  // mousedown on any inventory/hotbar/craft/furnace slot drives the drag
  // system. Furnace output can only be taken from, never inserted into.
  function attachDrag(slot, container, index) {
    slot.addEventListener('mousedown', (e) => {
      if (!inventoryOpen && !furnaceOpen) return;
      e.preventDefault();
      e.stopPropagation();

      if (dragItem) {
        // Holding an item: the furnace output is take-only.
        if (container === 'furnace-output') return;
        // Left = place all, right = place 1.
        const amount = (e.button === 2) ? 1 : 'all';
        placeDragItem(container, index, amount);
      } else {
        // Not holding: pick up. Left = all, right = half (only if stack > 1).
        const mode = (e.button === 2) ? 'half' : 'all';
        pickupFromSlot(container, index, mode);
      }
      renderHotbar();
      renderInventory();
      if (furnaceOpen) renderFurnace();
    });
  }

  // Furnace slots use fixed DOM nodes, so bind their handlers once.
  attachDrag(furnaceInputEl, 'furnace-input', 0);
  attachDrag(furnaceFuelEl, 'furnace-fuel', 0);
  attachDrag(furnaceOutputEl, 'furnace-output', 0);

  // Clicking anywhere that is not a slot (inventory background, canvas,
  // hotbar gaps, furnace panel background, etc.) while holding an item
  // returns it to its source. Slot and craft-output handlers call
  // stopPropagation(), so only genuine blank-area clicks reach this listener.
  document.addEventListener('mousedown', (e) => {
    if ((!inventoryOpen && !furnaceOpen) || !dragItem) return;
    const under = getSlotUnderCursor(e.clientX, e.clientY);
    if (!under) {
      e.preventDefault();
      returnDragItemToSource();
      renderHotbar();
      renderInventory();
      if (furnaceOpen) renderFurnace();
    }
  });

  // Suppress the browser context menu on inventory/hotbar/furnace so right-
  // click can be used for split (pick up half) and place-one operations.
  inventoryEl.addEventListener('contextmenu', (e) => e.preventDefault());
  hotbarEl.addEventListener('contextmenu', (e) => e.preventDefault());
  furnaceEl.addEventListener('contextmenu', (e) => e.preventDefault());

  // Keep the ghost following the cursor.
  document.addEventListener('mousemove', (e) => {
    moveGhost(e.clientX, e.clientY);
  });

  // Closing the inventory with an item still held returns it to its source.
  // (Handled inside toggleInventory above.)

  // Take the crafting output: add it to the inventory and consume one of
  // each material in the 3x3 grid. Does nothing if the inventory is full.
  function takeCraftOutput() {
    if (!craftingOutput) return;
    // Try to add the output to the inventory first; if it fails (full),
    // don't consume the materials.
    const added = addItem(craftingOutput.type, craftingOutput.count);
    if (!added) return;

    // Consume 1 from each non-empty crafting slot.
    for (let i = 0; i < CRAFT_SIZE; i++) {
      const s = craftingSlots[i];
      if (s) {
        s.count -= 1;
        if (s.count <= 0) craftingSlots[i] = null;
      }
    }
    renderHotbar();
    renderInventory();
  }
  // Clicking the output slot takes the crafted item.
  craftOutputEl.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (!inventoryOpen) return;
    e.preventDefault();
    e.stopPropagation();
    takeCraftOutput();
  });

  let itemNameTimer = null;
  function showItemName() {
    const s = hotbarSlots[hotbarIndex];
    const item = (s && s.count > 0) ? ITEM_BY_ID[s.type] : null;
    itemNameEl.textContent = item ? item.name : '';
    itemNameEl.classList.add('show');
    // Reset any pending fade-out so repeated switches keep it visible.
    if (itemNameTimer) clearTimeout(itemNameTimer);
    itemNameTimer = setTimeout(() => {
      itemNameEl.classList.remove('show');
      itemNameTimer = null;
    }, 1300);
  }

  function cycleHotbar(dir) {
    // dir > 0: next slot (down); dir < 0: prev slot (up). Infinite loop.
    hotbarIndex = (hotbarIndex + dir + HOTBAR_SIZE) % HOTBAR_SIZE;
    renderHotbar();
    showItemName();
  }

  window.addEventListener('wheel', (e) => {
    if (inventoryOpen || furnaceOpen) return; // don't switch while a UI is open
    e.preventDefault();
    cycleHotbar(e.deltaY > 0 ? 1 : -1);
  }, { passive: false });

  // ---------- Raycasting ----------
  const raycaster = new THREE.Raycaster();
  raycaster.far = 6;
  const camDir = new THREE.Vector3();
  // Terrain is the only raycast target. Water is purely visual — it never
  // occludes the ray and can never be the place/break target, so you cannot
  // place blocks on the water surface.
  const terrainMeshes = [grassTopMesh, grassSideMesh, dirtMesh, stoneMesh, woodMesh, leavesMesh, planksMesh,
    coalOreMesh, ironOreMesh, goldOreMesh, diamondOreMesh, redstoneOreMesh, furnaceMesh];

  function hitToBlock(hit) {
    const p = hit.point;

    // The hit point lies on a face plane, so one of its coordinates is
    // (almost) an integer. The axis closest to an integer is the face
    // normal axis. This avoids relying on hit.face.normal (which can be
    // flipped by DoubleSide materials).
    const fx = Math.abs(p.x - Math.round(p.x));
    const fy = Math.abs(p.y - Math.round(p.y));
    const fz = Math.abs(p.z - Math.round(p.z));

    // Outward face normal points toward the incoming ray, so its sign on
    // the face axis is opposite to the ray direction component on that axis.
    let nx = 0, ny = 0, nz = 0;
    if (fx <= fy && fx <= fz) {
      nx = camDir.x >= 0 ? -1 : 1;
    } else if (fy <= fz) {
      ny = camDir.y >= 0 ? -1 : 1;
    } else {
      nz = camDir.z >= 0 ? -1 : 1;
    }

    // Step from the hit point opposite to the outward normal (into the block)
    // and floor to get the struck block's coordinates.
    const EPS = 0.001;
    const bx = Math.floor(p.x - nx * EPS);
    const by = Math.floor(p.y - ny * EPS);
    const bz = Math.floor(p.z - nz * EPS);

    return { x: bx, y: by, z: bz, nx, ny, nz };
  }

  function pickBlock() {
    camera.getWorldDirection(camDir);
    // Cast from the player's eyes, not the camera, so reach stays consistent
    // in third person (where the camera sits blocks behind the player).
    raycaster.set(headPos, camDir);

    // Only terrain is targetable. Water is ignored by the raycaster — the
    // ray passes straight through it, so blocks below/behind water can be
    // hit, but open water (no terrain behind) yields no target.
    const terrainHits = raycaster.intersectObjects(terrainMeshes, false);
    if (terrainHits.length > 0) return hitToBlock(terrainHits[0]);

    return null;
  }

  function placeBlock(hit) {
    const s = hotbarSlots[hotbarIndex];
    if (!s || s.count <= 0) return; // no item in the selected hotbar slot
    const type = s.type;
    // Only placeable block types can be put into the world. Items like
    // sticks and tools cannot be placed.
    if (!PLACEABLE.has(type)) return;
    const tx = hit.x + Math.round(hit.nx);
    const ty = hit.y + Math.round(hit.ny);
    const tz = hit.z + Math.round(hit.nz);
    if (!inBounds(tx, ty, tz)) return;
    const key = k(tx, ty, tz);

    // Survival: consume one item from the selected hotbar slot before placing.
    // If the stack runs out, clear the slot. Creative items are infinite.
    if (gameMode === 'survival') {
      s.count -= 1;
      if (s.count <= 0) hotbarSlots[hotbarIndex] = null;
      renderHotbar();
    }

    if (type === WATER) {
      // Water is non-solid ("special air"): goes into waterSet,
      // cannot be placed inside an existing solid block.
      if (blockMap.has(key)) return;
      waterSet.add(key);
      waterDist.set(key, 0); // player-placed water is a fresh source
    } else {
      // Solid block: displaces any water at the target cell.
      if (blockMap.has(key)) return;
      waterSet.delete(key);
      waterDist.delete(key);
      setBlock(tx, ty, tz, type);
    }
    buildGeometry();
    restartWaterSpread();
  }
  function breakBlock(hit, canDrop = true) {
    const key = k(hit.x, hit.y, hit.z);
    let droppedType = null;
    if (blockMap.has(key)) {
      droppedType = blockMap.get(key); // remember what we broke (for pickup)
      removeBlock(hit.x, hit.y, hit.z);

      // Breaking a furnace also spills its contents and forgets its state.
      if (droppedType === FURNACE) {
        // If its UI is open, close it first so any held item is returned into
        // the furnace (and therefore collected with the rest below).
        if (furnaceOpen && openFurnaceKey === key) {
          if (dragItem) returnDragItemToSource();
          furnaceOpen = false;
          openFurnaceState = null;
          openFurnaceKey = null;
          furnaceEl.classList.remove('open');
          updateGhost();
        }
        const st = furnaceStates.get(key);
        if (st && gameMode === 'survival') {
          for (const it of [st.input, st.fuel, st.output]) {
            if (it && it.count > 0) addItem(it.type, it.count);
          }
        }
        furnaceStates.delete(key);
      }
    } else if (waterSet.has(key)) {
      waterSet.delete(key); // remove a water block (no item pickup)
      waterDist.delete(key);
    } else {
      return;
    }
    buildGeometry();
    restartWaterSpread(); // let water flow into the opened space

    // Survival: pick up the drop into the inventory. Ore blocks yield their
    // item (coal, raw iron, ...); other blocks drop themselves. If the tool
    // was too weak, nothing drops.
    if (gameMode === 'survival' && droppedType != null && canDrop) {
      let dropType = droppedType;
      if (ORE_DROP[droppedType] != null) dropType = ORE_DROP[droppedType];
      addItem(dropType, 1);
      renderHotbar();
      renderInventory();
    }
  }

  renderer.domElement.addEventListener('mousedown', (e) => {
    if (!controls.isLocked) return;
    if (e.button === 2) {                      // RMB: open furnace / place
      const hit = pickBlock();
      if (hit) {
        const hitType = blockMap.get(k(hit.x, hit.y, hit.z));
        if (hitType === FURNACE) {
          // Right-clicking a furnace opens its dedicated UI.
          openFurnaceAt(hit.x, hit.y, hit.z);
        } else {
          placeBlock(hit);
          swingHand();
        }
      }
    } else if (e.button === 0) {               // LMB: attack zombie / break block
      swingHand();
      // A zombie under the crosshair takes priority over the terrain behind it.
      const zb = pickZombie();
      if (zb) {
        const now = performance.now();
        if (now - lastAttackTime >= ATTACK_COOLDOWN) {
          lastAttackTime = now;
          damageZombie(zb, playerDamage);
        }
        return;   // never punch the block behind a zombie
      }
      if (gameMode === 'creative') {
        // Creative: instant break.
        const hit = pickBlock();
        if (hit) breakBlock(hit);
      } else {
        // Survival: start holding-to-mine. Actual progress accumulates in
        // the animate loop; releasing or aiming elsewhere cancels it.
        isMiningPressed = true;
      }
    }
  });
  // Releasing LMB cancels any in-progress mining.
  window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
      isMiningPressed = false;
      miningTarget = null;
      miningProgress = 0;
    }
  });
  // If the pointer leaves the canvas while held, also cancel mining.
  renderer.domElement.addEventListener('mouseleave', () => {
    isMiningPressed = false;
    miningTarget = null;
    miningProgress = 0;
  });
  renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Main loop ----------
  const up = new THREE.Vector3(0, 1, 0);
  const forward = new THREE.Vector3();
  const right = new THREE.Vector3();
  const wishDir = new THREE.Vector3();
  // Eye (head) position — camera anchor, raycast origin and water probe.
  const headPos = new THREE.Vector3(feet.x, feet.y + EYE_HEIGHT, feet.z);
  // Full 3D view direction (unlike `forward`, which is flattened for movement).
  const lookDir = new THREE.Vector3();
  let last = performance.now();

  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;

    tickWaterSpread(dt);

    // The avatar and the eye anchor both track the physics position, in
    // first and third person alike.
    playerMesh.position.set(feet.x, feet.y + PLAYER_BODY_H / 2, feet.z);
    headPos.set(feet.x, feet.y + EYE_HEIGHT, feet.z);

    // ---------- Day / night cycle ----------
    // worldTime only advances while the game is actually being played, so
    // opening a UI or pausing freezes the clock.
    if (gameMode && controls.isLocked && !isDead) {
      worldTime = (worldTime + dt * 1000) % DAY_LENGTH;
    }
    const phase = worldTime / DAY_LENGTH;
    updateSky(phase);
    const isNight = phase >= NIGHT_START;
    renderTimeLabel(isNight);

    if (isNight !== wasNight) {
      wasNight = isNight;
      if (!isNight) clearZombies();       // dawn: the whole horde is removed
      else zombieSpawnTimer = 0;          // dusk: start counting spawns
    }
    if (isNight && gameMode && !isDead) {
      zombieSpawnTimer += dt * 1000;
      if (zombieSpawnTimer >= ZOMBIE_SPAWN_INTERVAL) {
        zombieSpawnTimer -= ZOMBIE_SPAWN_INTERVAL;
        // Cap check before every attempt: at 10 alive, skip this spawn.
        if (zombies.length < MAX_ZOMBIES) spawnZombies(1);
      }
    } else {
      zombieSpawnTimer = 0;               // daytime pauses the spawn timer
    }

    // Furnaces keep smelting whether or not their UI is open.
    if (gameMode) tickFurnaces(dt);
    // Zombies only act while the game is actually running.
    if (gameMode && controls.isLocked && !isDead) tickZombies(dt);
    if (furnaceOpen && openFurnaceState) {
      if (openFurnaceState.dirty) renderFurnace();
      else updateFurnaceBars();
    }

    if (controls.isLocked && gameMode && !isDead) {
      camera.getWorldDirection(forward);
      forward.y = 0; forward.normalize();
      right.crossVectors(forward, up).normalize();
      wishDir.set(0, 0, 0);
      if (keys['KeyW']) wishDir.add(forward);
      if (keys['KeyS']) wishDir.sub(forward);
      if (keys['KeyD']) wishDir.add(right);
      if (keys['KeyA']) wishDir.sub(right);
      if (wishDir.lengthSq() > 0) wishDir.normalize();

      // Water resistance: check the player's BODY cells (feet + torso).
      const fx = Math.floor(feet.x);
      const fz = Math.floor(feet.z);
      const fy0 = Math.floor(feet.y);
      const inWater = isWater(fx, fy0, fz) || isWater(fx, fy0 + 1, fz);

      // Sneak: hold Shift (left or right). Hold semantics, not toggle.
      // When flying, Shift means "descend" and should NOT slow the player.
      const sneaking = !flying && !!(keys['ShiftLeft'] || keys['ShiftRight']);

      // Sprint: hold Tab while moving (WASD) — or while flying (boosts
      // vertical flight too). Sneak takes priority over sprint.
      const tabHeld = !!keys['Tab'];
      const sprinting = tabHeld && !sneaking &&
                        (wishDir.lengthSq() > 0 || flying);

      let speed = MOVE_SPEED
        * (inWater ? 0.5 : 1.0)
        * (sneaking ? SNEAK_SPEED_MULT : 1.0)
        * (sprinting ? SPRINT_SPEED_MULT : 1.0);
      if (flying) speed *= FLY_HORIZ_MULT;

      // Horizontal movement applies to both walking and flying. Edge
      // protection (sneak-stick-to-edge) only when walking on the ground.
      const protectEdge = sneaking && onGround && !flying;
      const dx = wishDir.x * speed * dt;
      const dz = wishDir.z * speed * dt;
      if (dx !== 0) {
        const nx = feet.x + dx;
        if (!collides(nx, feet.y, feet.z) &&
            !(protectEdge && !hasSupport(nx, feet.z))) {
          feet.x = nx;
        }
      }
      if (dz !== 0) {
        const nz = feet.z + dz;
        if (!collides(feet.x, feet.y, nz) &&
            !(protectEdge && !hasSupport(feet.x, nz))) {
          feet.z = nz;
        }
      }

      // ---------- Flight (creative only) ----------
      // No gravity; Space ascends, Shift descends.
      if (gameMode === 'creative' && flying) {
        // Holding Tab boosts both vertical and horizontal flight speed.
        const flySpeed = FLY_SPEED * (sprinting ? SPRINT_SPEED_MULT : 1.0);
        if (keys['Space']) feet.y += flySpeed * dt;
        if (keys['ShiftLeft'] || keys['ShiftRight']) feet.y -= flySpeed * dt;
        if (collides(feet.x, feet.y, feet.z)) {
          if (keys['Space']) feet.y -= flySpeed * dt;
          else feet.y += flySpeed * dt;
        }
        onGround = false;
      } else {
        // ---------- Normal walking + jump + gravity ----------
        if (keys['Space'] && onGround) { velocity.y = JUMP_SPEED; onGround = false; }

        velocity.y -= GRAVITY * dt;
        const ny = feet.y + velocity.y * dt;
        if (!collides(feet.x, ny, feet.z)) {
          feet.y = ny;
          onGround = false;
        } else {
          if (velocity.y < 0) onGround = true;
          velocity.y = 0;
        }
      }

      // ---------- Fall damage (survival only) ----------
      // Track the highest point while airborne; on landing compute the drop.
      if (gameMode === 'survival' && !flying) {
        if (!onGround) {
          if (!wasAirborne) { airborneMaxY = feet.y; wasAirborne = true; }
          else if (feet.y > airborneMaxY) airborneMaxY = feet.y;
          // Entering water cancels the accumulated fall immediately, so even
          // sinking to the lake bed after a 100-block dive costs nothing.
          if (feetInWater()) airborneMaxY = feet.y;
        } else if (wasAirborne) {
          // Just landed. Water beats the ground every time — even when only
          // part of the footprint is wet (shoreline landings included).
          const fallDist = airborneMaxY - feet.y;
          if (fallDist > 3 && !feetInWater()) {
            const dmg = Math.min(20, Math.floor(fallDist - 3));
            damagePlayer(dmg);
          }
          wasAirborne = false;
          airborneMaxY = feet.y;
        }
      }

      // ---------- Drowning (survival only) ----------
      // Counts time the player's HEAD (eye position) is inside a water block.
      if (gameMode === 'survival') {
        const headInWater = isWater(
          Math.floor(headPos.x),
          Math.floor(headPos.y),
          Math.floor(headPos.z)
        );
        if (headInWater) {
          underwaterTime += dt;
          if (underwaterTime > 10) {
            drownDamageTimer += dt;
            if (drownDamageTimer >= 1) {
              drownDamageTimer -= 1;
              damagePlayer(1);
            }
          }
        } else {
          underwaterTime = 0;
          drownDamageTimer = 0;
        }
      }

      // Camera height: drop the eye while sneaking.
      const eyeY = EYE_HEIGHT - (sneaking ? SNEAK_EYE_DROP : 0);
      headPos.set(feet.x, feet.y + eyeY, feet.z);
      if (thirdPerson) {
        // Pull the camera back along the view direction and lift it a little,
        // then aim at the body centre. Because the offset is derived from the
        // current orientation, mouse look still orbits the camera around the
        // player instead of fighting it.
        camera.getWorldDirection(lookDir);
        camera.position.copy(headPos)
          .addScaledVector(lookDir, -TPS_DISTANCE)
          .addScaledVector(up, TPS_LIFT);
        camera.lookAt(feet.x, feet.y + PLAYER_BODY_H * 0.5, feet.z);
      } else {
        camera.position.copy(headPos);
      }

      // Sprint FOV: smoothly widen the view while sprinting for a sense of
      // speed, then return to BASE_FOV when not sprinting.
      const targetFov = sprinting ? SPRINT_FOV : BASE_FOV;
      camera.fov += (targetFov - camera.fov) * Math.min(1, FOV_LERP_SPEED * dt);
      camera.updateProjectionMatrix();
    }

    // Underwater mask: if the player's HEAD block is water, overlay a
    // water-colored tint on the whole view. (The eye, not the camera — in
    // third person the camera sits several blocks behind the player.)
    const camInWater = isWater(
      Math.floor(headPos.x),
      Math.floor(headPos.y),
      Math.floor(headPos.z)
    );
    underwaterEl.classList.toggle('active', camInWater);

    // Sneak visual indicator (hold Shift).
    const isSneaking = !!(keys['ShiftLeft'] || keys['ShiftRight']);
    sneakEl.classList.toggle('active', isSneaking);

    // ---------- Mining progress (survival: hold LMB) ----------
    // In survival, holding LMB accumulates break progress on the targeted
    // block. Releasing, aiming elsewhere, or aiming at air cancels it.
    if (gameMode === 'survival' && isMiningPressed && !isDead) {
      const hit = pickBlock();
      if (hit) {
        const hitKey = k(hit.x, hit.y, hit.z);
        const blockType = blockMap.get(hitKey);
        const breakTime = blockType != null ? BREAK_TIME[blockType] : null;
        if (breakTime != null) {
          if (miningTarget !== hitKey) {
            // Target changed (or mining just started): reset progress.
            miningTarget = hitKey;
            miningProgress = 0;
          }
          // Pickaxe tier determines both speed and whether the block drops
          // anything. Wooden = 1 (1.5x), stone = 2 (2x). Without the required
          // tier mining is extremely slow and yields no drop.
          const held = hotbarSlots[hotbarIndex];
          const heldType = (held && held.count > 0) ? held.type : null;
          const info = harvestInfo(blockType, heldType);
          miningProgress += dt / (breakTime / info.speedMult);
          swingHand();   // repeated chops while mining (rate-limited)
          if (miningProgress >= 1) {
            // Block fully mined: break it (drops only if the tool is adequate).
            breakBlock(hit, info.drops);
            miningTarget = null;
            miningProgress = 0;
          }
        } else {
          // Target is water/air — can't mine, cancel progress.
          miningTarget = null;
          miningProgress = 0;
        }
      } else {
        // Aimed at nothing — cancel progress.
        miningTarget = null;
        miningProgress = 0;
      }
    } else if (miningProgress > 0 || miningTarget) {
      // Not actively mining: reset any leftover state.
      miningTarget = null;
      miningProgress = 0;
    }

    const hit = pickBlock();
    const miningRingEl = document.getElementById('mining-ring');
    if (hit) {
      highlight.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);
      highlight.visible = true;
      // Visual feedback: shift the highlight outline from black toward red
      // as mining progress increases, so the player sees the block "cracking".
      const p = Math.min(1, miningProgress);
      // Interpolate 0x000000 -> 0xff2020 (red) as p goes 0 -> 1.
      const r = Math.round(p * 0xff);
      const g = Math.round(p * 0x20);
      const b = Math.round(p * 0x20);
      highlight.material.color.setRGB(r / 255, g / 255, b / 255);

      // Circular progress ring below the crosshair: a conic-gradient arc
      // that fills clockwise as mining progress goes 0 -> 1.
      if (p > 0.001) {
        const deg = Math.round(p * 360);
        miningRingEl.style.background =
          'conic-gradient(#ffffff ' + deg + 'deg, rgba(255,255,255,0.15) ' + deg + 'deg)';
        miningRingEl.classList.add('active');
      } else {
        miningRingEl.classList.remove('active');
      }
    } else {
      highlight.visible = false;
      highlight.material.color.setHex(0x000000);
      miningRingEl.classList.remove('active');
    }

    renderer.render(scene, camera);
  }
  animate();
})();
</script>
